<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1925">
<title>Motion Sense｜顏色追蹤</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#09151e;color:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;touch-action:manipulation}#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);gap:9px;max-width:800px;margin:auto}
header{height:50px;min-height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 3px}h1{font-size:18px;letter-spacing:.1px;margin:0}#status{font-size:13px;color:#dce9f2;display:flex;align-items:center;gap:7px;white-space:nowrap}#dot{width:9px;height:9px;border-radius:50%;background:#718596}#dot.ok{background:#44e5a3}#dot.wait{background:#f9bd57}
#stage{flex:1;min-height:0;position:relative;border-radius:17px;overflow:hidden;background:#112c3c;border:1px solid #315263;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#video{display:none}
#instruction{position:absolute;left:12px;right:12px;top:12px;border-radius:12px;background:#071b27d9;padding:11px 13px;text-align:center;font-size:15px;line-height:1.5;pointer-events:none;box-shadow:0 3px 16px #071b2730}#instruction.hidden{display:none}#startCover{position:absolute;inset:0;background:#0d2636de;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;text-align:center;gap:15px}#startCover.hidden{display:none}#startCover p{font-size:15px;line-height:1.65;color:#b9d2e0;margin:0}#startCover strong{font-size:22px}
button{border-radius:12px;border:1px solid #456172;background:#203f51;color:#fff;font-weight:700;padding:12px 16px;cursor:pointer;min-height:48px}button:disabled{opacity:.45}button.primary{background:#25a47a;border-color:#25a47a;color:#fff}#controls{display:flex;align-items:stretch;gap:9px;flex-shrink:0}#reset{flex:1}#help{width:52px;padding:0;font-size:20px}#colorBox{width:60px;display:flex;align-items:center;justify-content:center;background:#152e3c;border:1px solid #406174;border-radius:12px}#sampleColor{width:28px;height:28px;border-radius:50%;background:#536a75;border:2px solid #fff8;box-shadow:0 0 0 2px #102330}#bottom{min-height:22px;text-align:center;font-size:12px;color:#a9c2d0}#alert{position:absolute;bottom:14px;left:12px;right:12px;background:#132b3be8;border-radius:12px;padding:11px;text-align:center;font-size:14px;line-height:1.5;pointer-events:none}#alert[hidden]{display:none}
#settings{position:absolute;inset:0;background:#081720ef;display:flex;justify-content:center;align-items:center;padding:22px}#settings[hidden]{display:none}#settings section{background:#173142;border:1px solid #335467;border-radius:16px;padding:20px;width:100%;max-width:420px}#settings h2{margin:0 0 10px;font-size:20px}#settings p{font-size:14px;line-height:1.7;color:#d5e4ec}#settings label{display:flex;gap:10px;align-items:center;margin:18px 0}#settings input{flex:1}#settings .actions{display:flex;justify-content:flex-end}#settings button{min-width:100px}
</style>
</head>
<body><main id="app">
<header><h1>Motion Sense <span style="font-size:13px;color:#aac9d7;font-weight:400">顏色追蹤</span></h1><div id="status" aria-live="polite"><span id="dot"></span><span id="statusText">尚未啟動</span></div></header>
<div id="stage">
<video id="video" playsinline autoplay muted></video><canvas id="canvas" aria-label="即時鏡頭畫面，點選要追蹤的物品顏色"></canvas>
<div id="instruction" class="hidden"></div>
<div id="alert" hidden></div>
<div id="startCover"><strong>追蹤手上拿的物品</strong><p>開啟前鏡頭後，點一下畫面中的彩色物品。物品移動時，綠色追蹤圈會跟著走；離開畫面後，再出現會自動找回。</p><button id="start" class="primary">啟動前鏡頭</button></div>
<div id="settings" hidden><section><h2>使用說明與調整</h2><p>① 將彩色物品放進鏡頭。<br>② 點一下物品中央，讓系統記住顏色。<br>③ 移動物品，觀察綠色追蹤圈。<br>④ 要換物品，按下方「重新選擇顏色」。</p><p>使用霧面、飽和、與背景不同的顏色會較穩定。同色衣物或桌面可能造成誤判；這個功能只辨識顏色，無法確定是哪一個物品。</p><label>顏色容許範圍 <input id="tolerance" type="range" min="8" max="30" value="16"><output id="tolValue">16</output></label><div class="actions"><button id="closeSettings">返回鏡頭</button></div></section></div>
</div>
<div id="controls"><div id="colorBox" title="目前選取的顏色"><span id="sampleColor"></span></div><button id="reset" disabled>重新選擇顏色</button><button id="help" aria-label="使用說明">?</button></div>
<div id="bottom">全程在裝置上辨識；不會上傳攝影機影像</div>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const vid=$('video'),view=$('canvas'),ctx=view.getContext('2d',{willReadFrequently:true});
const work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
const state={stream:null,running:false,selected:null,last:null,seen:false,frame:0,processing:false,camError:'',tolerance:16,failFrames:0};
const setStatus=(text,kind='')=>{$('statusText').textContent=text;$('dot').className=kind};
const note=(text)=>{$('instruction').textContent=text;$('instruction').classList.remove('hidden')};
const hideNote=()=>$('instruction').classList.add('hidden');
const popup=(text)=>{$('alert').textContent=text;$('alert').hidden=false;clearTimeout(popup.timeout);popup.timeout=setTimeout(()=>$('alert').hidden=true,2600)};
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d){switch(max){case r:h=((g-b)/d)%6;break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}h=(h*60+360)%360;}return [h,max===0?0:d/max,max]}
const hueDiff=(a,b)=>Math.min(Math.abs(a-b),360-Math.abs(a-b));
function sizeCanvas(){const rect=$('stage').getBoundingClientRect();const scale=Math.min(1,300/rect.width,530/rect.height);work.width=Math.max(100,Math.round(rect.width*scale));work.height=Math.max(100,Math.round(rect.height*scale));view.width=work.width;view.height=work.height;state.last=null;}
// Draw exactly the same mirrored, cover-cropped camera image used for color analysis.
function drawCamera(){const W=work.width,H=work.height,vw=vid.videoWidth,vh=vid.videoHeight;if(!vw||!vh)return false;const s=Math.max(W/vw,H/vh),sw=W/s,sh=H/s,sx=(vw-sw)/2,sy=(vh-sh)/2;
wctx.save();wctx.translate(W,0);wctx.scale(-1,1);wctx.drawImage(vid,sx,sy,sw,sh,0,0,W,H);wctx.restore();return true;}
function sampleColor(x,y){const W=work.width,H=work.height;const im=wctx.getImageData(0,0,W,H).data;let a=[];for(let yy=Math.max(0,y-6);yy<=Math.min(H-1,y+6);yy+=2){for(let xx=Math.max(0,x-6);xx<=Math.min(W-1,x+6);xx+=2){const k=(yy*W+xx)*4;const c=rgb2hsv(im[k],im[k+1],im[k+2]);if(c[1]>.18&&c[2]>.14)a.push({c,r:im[k],g:im[k+1],b:im[k+2]});}}
if(a.length<8){popup('此處顏色太淡或太暗，請點選較鮮明的物品');return;}
// Circular median approximation: choose hue nearest to dominant 10-degree bin.
let bins=new Array(36).fill(0);for(const p of a)bins[Math.floor(p.c[0]/10)%36]++;
let best=0;for(let i=0;i<36;i++){const score=bins[(i+35)%36]+bins[i]+bins[(i+1)%36];if(score>best){best=score;state.bin=i;}}
let center=state.bin*10+5;let sel=a.filter(p=>hueDiff(p.c[0],center)<22);if(sel.length<5)sel=a;
sel.sort((p,q)=>p.c[1]-q.c[1]);const med=sel[Math.floor(sel.length/2)];let hsumX=0,hsumY=0;for(const p of sel){hsumX+=Math.cos(p.c[0]*Math.PI/180);hsumY+=Math.sin(p.c[0]*Math.PI/180)}
const hue=(Math.atan2(hsumY,hsumX)*180/Math.PI+360)%360;
state.selected={hue,sat:med.c[1],val:med.c[2],r:med.r,g:med.g,b:med.b};state.last=null;state.failFrames=0;
$('sampleColor').style.background=`rgb(${med.r},${med.g},${med.b})`;$('reset').disabled=false;hideNote();setStatus('正在尋找物品','wait');
}
function segment(image){const W=work.width,H=work.height,pixels=image.data,c=state.selected;if(!c)return null;
// Low-resolution binary mask for efficient connected component analysis.
const step=3,gw=Math.ceil(W/step),gh=Math.ceil(H/step);let mask=new Uint8Array(gw*gh);let matches=0;
const htol=state.tolerance,stol=.34,vtol=.44;
for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
 const x=Math.min(W-1,gx*step+1),y=Math.min(H-1,gy*step+1),i=(y*W+x)*4;
 const hsv=rgb2hsv(pixels[i],pixels[i+1],pixels[i+2]);
 if(hueDiff(hsv[0],c.hue)<=htol && hsv[1]>=Math.max(.21,c.sat-stol) && hsv[2]>=Math.max(.13,c.val-vtol)&&hsv[2]<=Math.min(1,c.val+vtol)) {mask[gy*gw+gx]=1;matches++;}
}
if(matches>gw*gh*.4)return {ambiguous:true};
const visited=new Uint8Array(mask.length), comps=[];
for(let i=0;i<mask.length;i++){
if(!mask[i]||visited[i])continue;
let queue=[i],head=0;visited[i]=1;let count=0,minX=gw,maxX=0,minY=gh,maxY=0,sx=0,sy=0;
while(head<queue.length){let cur=queue[head++],cy=Math.floor(cur/gw),cx=cur%gw;count++;sx+=cx;sy+=cy;minX=Math.min(minX,cx);maxX=Math.max(maxX,cx);minY=Math.min(minY,cy);maxY=Math.max(maxY,cy);
const ns=[cur-1,cur+1,cur-gw,cur+gw];for(let j=0;j<4;j++){const n=ns[j];if(n<0||n>=mask.length)continue;if(j===0&&cx===0||j===1&&cx===gw-1)continue;if(mask[n]&&!visited[n]){visited[n]=1;queue.push(n)}}
}
if(count>=Math.max(5,Math.round(gw*gh*.0007)))comps.push({count,x:(sx/count+.5)*step,y:(sy/count+.5)*step,box:[minX*step,minY*step,Math.min(W,(maxX+1)*step),Math.min(H,(maxY+1)*step)]});
}
if(!comps.length)return null;
// Favor substantial regions, with a modest continuity bonus. Can still confuse identical-colored objects.
comps.sort((a,b)=>score(b)-score(a));
function score(o){const bonus=state.last?Math.max(0,1-Math.hypot(o.x-state.last.x,o.y-state.last.y)/(Math.max(W,H)*.5))*.4:0;return o.count*(1+bonus)}
return comps[0];
}
function render(ms){if(!state.running)return;requestAnimationFrame(render);if(ms-state.frame<65)return;state.frame=ms;
if(vid.readyState<2||!drawCamera())return;
const W=work.width,H=work.height;const im=wctx.getImageData(0,0,W,H);
ctx.putImageData(im,0,0);
if(!state.selected)return;
const o=segment(im);
if(o?.ambiguous){state.last=null;state.failFrames++;setStatus('顏色太多，無法區分','wait');note('畫面中有太多相近顏色，請換背景或重新選色');return;}
if(o){state.last={x:o.x,y:o.y};state.failFrames=0;state.seen=true;hideNote();setStatus('已偵測到顏色','ok');
const [x1,y1,x2,y2]=o.box,rad=Math.max(20,Math.min(110,Math.max(x2-x1,y2-y1)*.65));
ctx.save();ctx.strokeStyle='#47ffac';ctx.lineWidth=3.2;ctx.shadowColor='#10e78f';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(o.x,o.y,rad,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#47ffac';ctx.beginPath();ctx.arc(o.x,o.y,4.5,0,Math.PI*2);ctx.fill();ctx.restore();
}else{state.failFrames++;state.last=null;setStatus('未偵測到顏色','wait');if(state.failFrames>4)note('目前找不到物品；重新進入畫面會自動追蹤');}
}
function pointer(e){if(!state.running||vid.readyState<2)return;if($('settings').hidden===false)return;const rect=view.getBoundingClientRect();const x=Math.max(0,Math.min(work.width-1,Math.floor((e.clientX-rect.left)/rect.width*work.width)));const y=Math.max(0,Math.min(work.height-1,Math.floor((e.clientY-rect.top)/rect.height*work.height)));
// Use current camera frame, without overlays, to sample the tapped color.
if(drawCamera())sampleColor(x,y);
}
async function start(){const btn=$('start');btn.disabled=true;btn.textContent='正在啟動…';setStatus('啟動攝影機中','wait');
try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('此瀏覽器無法啟動相機。請從 HTTPS 網址開啟，並使用 Safari 或 Chrome。');
const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}});state.stream=s;vid.srcObject=s;await vid.play();
sizeCanvas();state.running=true;$('startCover').classList.add('hidden');$('reset').disabled=false;setStatus('等待選擇顏色','wait');note('把彩色物品放進畫面，點一下物品中央');requestAnimationFrame(render);
}catch(e){let msg='無法啟動相機：'+(e?.message||String(e));if(e?.name==='NotAllowedError')msg='相機權限被拒絕，請在瀏覽器設定中允許攝影機';if(e?.name==='NotFoundError')msg='找不到可使用的攝影機';setStatus('啟動失敗','wait');popup(msg);$('startCover').querySelector('p').textContent=msg;btn.disabled=false;btn.textContent='重新啟動';}}
$('start').addEventListener('click',start);view.addEventListener('pointerdown',pointer);
$('reset').addEventListener('click',()=>{state.selected=null;state.last=null;state.seen=false;state.failFrames=0;$('sampleColor').style.background='#536a75';setStatus('等待選擇顏色','wait');note('點一下畫面中想追蹤的彩色物品')});
$('help').addEventListener('click',()=>{$('settings').hidden=false});$('closeSettings').addEventListener('click',()=>{$('settings').hidden=true});
$('tolerance').addEventListener('input',e=>{state.tolerance=Number(e.target.value);$('tolValue').textContent=e.target.value});
window.addEventListener('resize',()=>{if(state.running)sizeCanvas()});
window.addEventListener('pagehide',()=>{state.stream?.getTracks().forEach(t=>t.stop());state.running=false});
})();
</script></body></html>
