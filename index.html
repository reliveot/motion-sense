<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motion Sense｜體感復健練習站</title>
<style>
:root{color-scheme:dark;--bg:#111b25;--panel:#1d2c39;--accent:#ffba75;--light:#e8f4ed}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:#fff}main{max-width:900px;margin:auto;padding:14px;display:grid;gap:12px}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:1.2rem;margin:2px 0}.sub{font-size:.86rem;color:#b7c9d5}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:none;border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;color:white;background:#34495a;cursor:pointer}button.active,button.primary{background:#ec9a57;color:#182532}button:disabled{opacity:.5;cursor:default}.stage{position:relative;aspect-ratio:4/3;max-height:72vh;background:#080e14;border-radius:20px;overflow:hidden;border:2px solid #2b4252}.stage video,.stage canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;transform:scaleX(-1)}.stage canvas{z-index:1;pointer-events:none}.overlay{pointer-events:none;position:absolute;inset:0;z-index:2}.target{position:absolute;width:27%;height:36%;border:5px solid #ffcb78;border-radius:26px;background:#ffba7524;display:flex;align-items:center;justify-content:center;font-size:clamp(1.5rem,5vw,3.1rem);font-weight:900;text-shadow:0 2px 12px #0008;transition:background .12s,border-color .12s}.target.left{left:5%;top:31%}.target.right{right:5%;top:31%}.target.hit{border-color:#79e7ae;background:#4fcf9f77}.centerLine{position:absolute;left:50%;top:0;height:100%;border-left:2px dashed #ffffff65}.indicator{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-size:.85rem}.pill{background:#06111bc9;padding:7px 10px;border-radius:12px}.status{border-radius:14px;background:var(--panel);padding:12px 14px;min-height:50px}.statrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.score{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums}.help{color:#c5d7df;font-size:.9rem;line-height:1.65}.notice{color:#ffd7a1;font-size:.84rem}.dot{width:16px;height:16px;background:#84efbe;border:2px solid white;border-radius:50%;position:absolute;z-index:4;transform:translate(-50%,-50%);box-shadow:0 0 8px black}.hidden{display:none!important}@media(max-width:530px){main{padding:9px;gap:9px}.stage{aspect-ratio:3/4}.target{width:32%;height:26%;top:36%!important}.target.left{left:3%}.target.right{right:3%}.tabs button{flex:1}.score{font-size:1.6rem}}
.centerLine{left:50%;transition:left .25s}.centerLine::after{content:'中心基準';position:absolute;top:52%;left:5px;white-space:nowrap;font-size:12px;background:#07131cc9;padding:4px 6px;border-radius:6px}.target{transition:background .12s,border-color .12s,opacity .12s}.statebar{background:#263c4a;padding:10px 14px;border-radius:12px;font-size:1rem;font-weight:750}.statebar.good{background:#174a3d;color:#baf4d7}.statebar.wait{background:#564225;color:#ffe0a5}.statebar.lost{background:#50323a;color:#ffd0d0}.statebar.ready{background:#263c4a;color:#d0e7f5}.progressline{height:8px;border-radius:10px;background:#344a58;overflow:hidden}.progressfill{height:100%;width:0;background:#76ddb1;transition:width .08s}.dot{width:25px;height:25px;border:3px solid white;background:#32dda6;box-shadow:0 0 0 5px #00c89950,0 0 12px #000}.dot.lost{background:#ef8f80}.stage .instructionTag{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;background:#06111bc9;border-radius:10px;padding:8px;font-size:.92rem;font-weight:700;z-index:3} 
</style>
</head>
<body><main>
<header><div><h1>Motion Sense｜體感復健練習站</h1><div class="sub">初版測試｜不需要安裝 App</div></div><div class="tabs"><button id="handBtn" class="active">✋ 手部碰觸</button><button id="headBtn">🙂 坐姿／頭部</button></div></header>
<div class="stage" id="stage"><video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas><div class="overlay"><div class="centerLine" id="centerLine"></div><div id="left" class="target left">左</div><div id="right" class="target right">右</div><div class="indicator"><span id="modeLabel" class="pill">手部模式</span><span class="pill" id="trackingLabel">鏡頭未啟動</span></div><div class="dot hidden" id="pointer"></div><div class="instructionTag" id="stageHint">請先啟動鏡頭</div></div></div>
<div class="statrow"><div>成功次數：<span class="score" id="score">0</span><span class="sub"> / <span id="goalText">10</span></span></div><div class="actions"><button class="primary" id="start">啟動鏡頭</button><button id="reset">重新開始</button><button id="calibrate" class="hidden">將目前頭部位置設為中心</button></div></div>
<div class="statebar ready" id="liveState" aria-live="polite">⚪ 鏡頭尚未啟動</div><div class="progressline"><div class="progressfill" id="progressFill"></div></div><div class="status" id="status" aria-live="polite">按「啟動鏡頭」，允許攝影機權限後開始。</div>
<div class="help" id="instruction">手部模式：把手移動到畫面中亮起的「左／右」區域，停留約 0.3 秒即算 1 次。手掌不需要完全打開，但需要讓鏡頭辨識到手。</div>
<div class="notice">提醒：這是鏡頭中的虛擬碰觸，不需真的碰到鏡頭。建議將鏡頭固定，臉和手有充足光線。影像只在本機瀏覽器分析，不會上傳到本工具伺服器；首次使用需連線下載辨識模型。攝影機需在 HTTPS 網站或 localhost 使用。</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
const $=id=>document.getElementById(id), video=$('video'), canvas=$('canvas'),ctx=canvas.getContext('2d');
let mode='hand',stream=null,hands=null,face=null,running=false,busy=false,score=0,goal=10,target='left',lastHit=0,startedInside=0,headCenter=null,centerSamples=[],point=null,inProgress=false,calibrating=false,handMustExit=false,hitShownUntil=0;
const setStatus=s=>$('status').textContent=s;
function state(kind,msg){const el=$('liveState');el.className='statebar '+kind;el.textContent=msg;}
function hint(msg){$('stageHint').textContent=msg;}
function chooseTarget(){let next=Math.random()<.5?'left':'right';target=next;$('left').style.opacity=target==='left'?'1':'.2';$('right').style.opacity=target==='right'?'1':'.2';}
function reset(){score=0;$('score').textContent=score;startedInside=0;handMustExit=false;lastHit=0;inProgress=false;chooseTarget();$('progressFill').style.width='0%';setStatus(mode==='hand'?'讓手移入亮起的目標區域，成功後先移開再進行下一次。':'先按「將目前頭部位置設為中心」，再開始左右移動。');state('ready',running?'準備開始':'⚪ 等待鏡頭');hint(mode==='hand'?'請將手移到亮起的區域':'請先校正中心');}
function switchMode(m){mode=m;$('handBtn').classList.toggle('active',m==='hand');$('headBtn').classList.toggle('active',m==='head');$('calibrate').classList.toggle('hidden',m!=='head');$('modeLabel').textContent=m==='hand'?'手部模式':'坐姿／頭部模式';$('instruction').textContent=m==='hand'?'手部模式：畫面中的綠點代表系統追蹤到的手部中心。將綠點移入亮起的目標，停留約 0.3 秒；成功後須先移開，再碰下一個目標。':'坐姿／頭部模式：先坐好，按「將目前頭部位置設為中心」，保持不動約 1 秒。校正後虛線會移到你的頭部基準位置；回到虛線附近再往亮起方向移動。注意：此測試僅追蹤鼻子水平位置，不能評估真正的坐姿平衡。';headCenter=null;calibrating=false;centerSamples=[];$('centerLine').style.left='50%';$('centerLine').style.display=m==='head'?'block':'none';reset();}
$('handBtn').onclick=()=>switchMode('hand');$('headBtn').onclick=()=>switchMode('head');$('reset').onclick=()=>{if(mode==='head'){headCenter=null;calibrating=false;centerSamples=[];$('centerLine').style.left='50%';}reset();};
$('calibrate').onclick=()=>{headCenter=null;calibrating=true;centerSamples=[];inProgress=false;state('wait','🟡 正在校正，請保持頭部不動');hint('記錄現在的位置約 1 秒…');setStatus('正在取樣你的頭部位置，完成後虛線會移到新的中心。');};
function dims(){const w=video.videoWidth,h=video.videoHeight;if(w&&h&&(canvas.width!==w||canvas.height!==h)){canvas.width=w;canvas.height=h;}}
function project(x,y){const box=$('stage').getBoundingClientRect();const vw=video.videoWidth||640,vh=video.videoHeight||480;const scale=Math.max(box.width/vw,box.height/vh);return {x:(x*vw*scale-(vw*scale-box.width)/2)/box.width,y:(y*vh*scale-(vh*scale-box.height)/2)/box.height};}
function mark(x,y){const d=$('pointer');if(x===null){d.classList.add('hidden');return;}const p=project(x,y);d.classList.remove('hidden');d.style.left=(p.x*100)+'%';d.style.top=(p.y*100)+'%';}
function detectHit(x,y){if(x==null||y==null){startedInside=0;$('progressFill').style.width='0%';return;}
const container=$('stage').getBoundingClientRect(),box=$(target).getBoundingClientRect(),projected=project(x,y),px=container.left+projected.x*container.width,py=container.top+projected.y*container.height;
const inside=px>=box.left&&px<=box.right&&py>=box.top&&py<=box.bottom;const now=performance.now();
if(handMustExit){$('progressFill').style.width='0%';if(!inside){handMustExit=false;state('ready','🟢 手已離開目標，可以再次碰觸');hint('請碰亮起的目標');}else{state('wait','🟡 已成功，請先把手移出目標');hint('先移開手，才能計算下一次');}return;}
if(inside){if(!startedInside)startedInside=now;const elapsed=now-startedInside;$('progressFill').style.width=Math.min(100,elapsed/300*100)+'%';state('good','🟢 已偵測到手｜正在碰觸目標');hint('保持一下，即將成功');if(elapsed>=300){registerHit();handMustExit=true;}}else{startedInside=0;$('progressFill').style.width='0%';state('ready','🟢 已偵測到手｜目前在目標外');hint('移到亮起的目標區');}}
function registerHit(){const curr=target;lastHit=performance.now();score++;$('score').textContent=score;$(curr).classList.add('hit');setTimeout(()=>$(curr).classList.remove('hit'),300);$('progressFill').style.width='100%';if(score>=goal){setStatus('已完成 '+goal+' 次！按「重新開始」再練習。');state('good','✅ 練習完成');hint('完成！');running=false;return;}chooseTarget();setStatus('成功 +1！已切換下一個目標。');}
function drawResults(r,kind){dims();ctx.clearRect(0,0,canvas.width,canvas.height);let p=null;
if(kind==='hand'&&r.multiHandLandmarks?.length){const points=r.multiHandLandmarks[0],q=[0,5,9,13,17].map(i=>points[i]);p={x:1-q.reduce((a,v)=>a+v.x,0)/q.length,y:q.reduce((a,v)=>a+v.y,0)/q.length};}
else if(kind==='head'&&r.multiFaceLandmarks?.length){const nose=r.multiFaceLandmarks[0][1];p={x:1-nose.x,y:nose.y};}
if(!p){mark(null,null);$('trackingLabel').textContent=kind==='hand'?'找不到手':'找不到臉';startedInside=0;$('progressFill').style.width='0%';if(kind==='hand')handMustExit=false;state('lost',kind==='hand'?'🔴 未辨識到手｜請把手移回鏡頭畫面':'🔴 未辨識到臉｜請調整鏡頭');hint(kind==='hand'?'鏡頭找不到手':'鏡頭找不到臉');return;}
mark(p.x,p.y);$('trackingLabel').textContent=kind==='hand'?'已追蹤到手':'已追蹤到臉';
if(kind==='hand'){if(running)detectHit(p.x,p.y);return;}
if(!calibrating&&headCenter===null){state('wait','🟡 已辨識到臉｜尚未校正中心');hint('請按下方的「將目前頭部位置設為中心」');return;}
if(calibrating){centerSamples.push(project(p.x,p.y).x);$('progressFill').style.width=Math.min(100,centerSamples.length/25*100)+'%';if(centerSamples.length>=25){headCenter=centerSamples.reduce((a,b)=>a+b,0)/centerSamples.length;calibrating=false;$('centerLine').style.left=(headCenter*100)+'%';$('progressFill').style.width='0%';state('good','🟢 校正完成｜虛線已移到你的中心');hint('回到中心線附近，再往亮起方向移動');setStatus('中心已設定在畫面的 '+Math.round(headCenter*100)+'% 位置。綠點是目前鼻子位置。');}return;}
const nowX=project(p.x,p.y).x,dx=nowX-headCenter,centerThreshold=.055,moveThreshold=.12;
if(!inProgress){if(Math.abs(dx)<centerThreshold){inProgress=true;state('ready','🟢 已回到中心｜可向目標方向移動');hint('往亮起方向移動');}else{state('wait','🟡 請先回到中心線附近');hint('綠點回到虛線附近');}}
else if((target==='left'&&dx< -moveThreshold)||(target==='right'&&dx>moveThreshold)){registerHit();inProgress=false;}
else{state('ready','🟢 正在追蹤頭部｜往亮起方向移動');hint('往亮起的方向移動');}}
async function initModels(){if(typeof Hands==='undefined'||typeof FaceMesh==='undefined')throw new Error('辨識程式載入失敗，請確認網路連線。');
if(!hands){hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.5,minTrackingConfidence:.4});hands.onResults(r=>{if(mode==='hand')drawResults(r,'hand');});}
if(!face){face=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});face.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});face.onResults(r=>{if(mode==='head')drawResults(r,'head');});}}
async function loop(){if(!stream)return;if(video.readyState>=2&&!busy&&running){busy=true;try{if(mode==='hand')await hands.send({image:video});else await face.send({image:video});}catch(e){setStatus('辨識執行失敗：'+e.message);running=false;}finally{busy=false;}}requestAnimationFrame(loop);}
$('start').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){setStatus('瀏覽器不支援攝影機，或不是 HTTPS 網站。');return;}try{$('start').disabled=true;setStatus('正在啟動攝影機與辨識模型…');if(!stream){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();}await initModels();running=true;reset();$('start').textContent='鏡頭已啟動';loop();}catch(e){setStatus('無法啟動：'+e.message+'。請確認鏡頭權限、HTTPS 與網路。');$('start').disabled=false;}};
chooseTarget();$('centerLine').style.display='none';document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;}else if(stream&&score<goal)running=true;});
</script></body></html>
